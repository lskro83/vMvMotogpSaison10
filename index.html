<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vMv | MotoGP - SAISON 10</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #061121;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .bg-vmsdark { background-color: #0a1930; }
        .bg-vmsdarker { background-color: #061121; }
        .border-gold { border-color: #d4af37; }
        .text-gold { color: #d4af37; }
        .gold-gradient {
            background: linear-gradient(90deg, #b8860b 0%, #ffd700 50%, #b8860b 100%);
        }
    </style>
</head>
<body class="min-h-screen p-2 md:p-6 bg-vmsdarker">

    <!-- En-tête officiel vMv -->
    <div class="max-w-7xl mx-auto border-2 border-gold rounded-xl p-4 bg-vmsdark shadow-2xl mb-6">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-gold text-black font-extrabold px-3 py-1 rounded text-lg tracking-wider shadow">vMv</div>
                <span class="text-xl font-bold tracking-widest text-gold uppercase">MotoGP - SAISON 10</span>
            </div>
            
            <!-- Boutons de navigation des tableaux -->
            <div class="flex flex-wrap gap-2 justify-center">
                <button onclick="switchTab('constructors')" id="btn-constructors" class="px-4 py-2 font-bold rounded-lg text-sm transition-all bg-amber-500 text-black shadow-lg">🏆 Écuries Interligue</button>
                <button onclick="switchTab('leagueA')" id="btn-leagueA" class="px-4 py-2 font-bold rounded-lg text-sm transition-all bg-blue-900/60 text-white hover:bg-blue-800">🏁 Ligue A (20 Pilotes)</button>
                <button onclick="switchTab('leagueB')" id="btn-leagueB" class="px-4 py-2 font-bold rounded-lg text-sm transition-all bg-blue-900/60 text-white hover:bg-blue-800">🏁 Ligue B (20 Pilotes)</button>
            </div>

            <div class="flex gap-2">
                <button onclick="toggleEditMode()" id="btn-edit" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-sm shadow">✏️ Activer Édition</button>
                <button onclick="resetData()" class="px-3 py-2 bg-red-800 hover:bg-red-700 text-white font-bold rounded-lg text-sm shadow" title="Réinitialiser">🔄</button>
            </div>
        </div>
    </div>

    <!-- Conteneur Principal des Tableaux -->
    <div class="max-w-7xl mx-auto border-2 border-gold rounded-xl bg-vmsdark overflow-hidden shadow-2xl">
        
        <!-- Titre du tableau actif -->
        <div id="table-title-banner" class="gold-gradient text-black text-center font-black py-2 text-lg tracking-wider uppercase shadow-inner">
            Classement Ecuries Interligue
        </div>

        <div class="overflow-x-auto">
            <div id="app-content" class="p-2 min-w-[1000px]">
                <!-- Inséré dynamiquement par JavaScript -->
            </div>
        </div>
    </div>

    <!-- Pied de page -->
    <div class="max-w-7xl mx-auto mt-4 flex justify-between items-center text-xs text-slate-400 px-2">
        <span>📸 Astuce GitHub Pages : Hébergez ce fichier pour y accéder partout depuis votre iPhone !</span>
        <span class="text-gold font-semibold">[vMv] VilVinde Multigaming</span>
    </div>

    <script>
        // Données des circuits (10 manches)
        const circuits = ["Misano", "Phillip Island", "Sepang", "Aragon", "Austin", "Catalunya", "Portimao", "Mugello", "Motegi", "Jerez"];
        
        // 10 Écuries officielles MotoGP
        const teamsConfig = [
            { id: "trackhouse", name: "Aprilia TrackHouse", color: "#00b4d8" },
            { id: "vr46", name: "Ducati VR46", color: "#ffd166" },
            { id: "pramac", name: "Yamaha Pramac", color: "#7209b7" },
            { id: "ktm", name: "Red Bull KTM", color: "#f77f00" },
            { id: "lcr", name: "Honda LCR", color: "#52b788" },
            { id: "tech3", name: "KTM Tech 3", color: "#ffb703" },
            { id: "aprilia", name: "Aprilia Factory", color: "#b5179e" },
            { id: "ducati", name: "Ducati Lenovo", color: "#d90429" },
            { id: "yamaha", name: "Yamaha Factory", color: "#4361ee" },
            { id: "hrc", name: "Honda HRC", color: "#3a86ff" }
        ];

        let currentTab = 'constructors';
        let isEditMode = false;

        // Génération automatique de 20 pilotes pour la Ligue A (2 par écurie) et 20 pour la Ligue B
        function generateDefaultPilots(leagueName) {
            let pilots = [];
            let idCounter = 1;
            teamsConfig.forEach(team => {
                // 2 pilotes par écurie pour cette ligue
                for (let i = 1; i <= 2; i++) {
                    pilots.push({
                        id: `${leagueName}_${team.id}_${i}`,
                        name: `${team.name} (${leagueName === 'A' ? 'Pilote A' : 'Pilote B'} ${i})`,
                        teamId: team.id,
                        scores: new Array(10).fill(0)
                    });
                    idCounter++;
                }
            });
            return pilots;
        }

        // Chargement ou initialisation des données en localStorage
        let appData = JSON.parse(localStorage.getItem('vmv_motoGP_saison10')) || {
            leagueA: generateDefaultPilots('A'),
            leagueB: generateDefaultPilots('B')
        };

        function saveData() {
            localStorage.setItem('vmv_motoGP_saison10', JSON.stringify(appData));
        }

        function switchTab(tab) {
            currentTab = tab;
            ['constructors', 'leagueA', 'leagueB'].forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                if (t === tab) {
                    btn.className = "px-4 py-2 font-bold rounded-lg text-sm transition-all bg-amber-500 text-black shadow-lg";
                } else {
                    btn.className = "px-4 py-2 font-bold rounded-lg text-sm transition-all bg-blue-900/60 text-white hover:bg-blue-800";
                }
            });
            render();
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            const btn = document.getElementById('btn-edit');
            if (isEditMode) {
                btn.className = "px-3 py-2 bg-amber-600 hover:bg-amber-500 text-black font-bold rounded-lg text-sm shadow";
                btn.innerHTML = "💾 Verrouiller Édition";
            } else {
                btn.className = "px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-sm shadow";
                btn.innerHTML = "✏️️ Activer Édition";
            }
            render();
        }

        function resetData() {
            if (confirm("Voulez-vous vraiment réinitialiser toutes les données de la Saison 10 ?")) {
                appData = {
                    leagueA: generateDefaultPilots('A'),
                    leagueB: generateDefaultPilots('B')
                };
                saveData();
                render();
            }
        }

        function updateScore(league, pilotId, circuitIdx, val) {
            const num = parseInt(val) || 0;
            const pilot = appData[`league${league}`].find(p => p.id === pilotId);
            if (pilot) {
                pilot.scores[circuitIdx] = num;
                saveData();
                render(); // Met à jour l'affichage en direct
            }
        }

        function updateName(league, pilotId, newName) {
            const pilot = appData[`league${league}`].find(p => p.id === pilotId);
            if (pilot) {
                pilot.name = newName;
                saveData();
            }
        }

        function render() {
            const container = document.getElementById('app-content');
            const titleBanner = document.getElementById('table-title-banner');

            if (currentTab === 'constructors') {
                titleBanner.innerText = "CLASSEMENT ECURIES INTERLIGUE (2 LIGUES - 4 PILOTES)";
                
                // Calcul des scores par écurie (Somme Ligue A (2 pilotes) + Ligue B (2 pilotes))
                let constructorsSummary = teamsConfig.map(team => {
                    let teamPilotsA = appData.leagueA.filter(p => p.teamId === team.id);
                    let teamPilotsB = appData.leagueB.filter(p => p.teamId === team.id);
                    let allTeamPilots = [...teamPilotsA, ...teamPilotsB];

                    let totalScores = new Array(10).fill(0);
                    allTeamPilots.forEach(p => {
                        p.scores.forEach((s, idx) => {
                            totalScores[idx] += s;
                        });
                    });
                    let grandTotal = totalScores.reduce((a, b) => a + b, 0);

                    return {
                        ...team,
                        total: grandTotal,
                        circuitScores: totalScores
                    };
                });

                // Tri par total décroissant
                constructorsSummary.sort((a, b) => b.total - a.total);

                let html = `
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-blue-950/80 text-gold border-b border-gold/30 text-xs">
                                <th class="p-2 w-12 text-center">POS.</th>
                                <th class="p-2">ECURIE</th>
                                <th class="p-2 text-center w-16">TOTAL</th>
                                ${circuits.map(c => `<th class="p-2 text-center">${c.substring(0,3).toUpperCase()}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
                `;

                constructorsSummary.forEach((item, index) => {
                    html += `
                        <tr class="border-b border-slate-800 hover:bg-slate-900/60 transition-colors">
                            <td class="p-2 text-center font-bold text-slate-300">${index + 1}</td>
                            <td class="p-2 font-bold flex items-center gap-2">
                                <span class="w-3 h-3 rounded-full inline-block" style="background-color: ${item.color};"></span>
                                <span class="text-white">${item.name}</span>
                            </td>
                            <td class="p-2 text-center font-black text-gold bg-black/20">${item.total}</td>
                            ${item.circuitScores.map(score => `<td class="p-2 text-center font-medium text-slate-200">${score}</td>`).join('')}
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                container.innerHTML = html;

            } else {
                // Tableaux Ligues A ou B (20 pilotes)
                let leagueKey = currentTab === 'leagueA' ? 'A' : 'B';
                titleBanner.innerText = `CLASSEMENT LIGUE ${leagueKey} (20 PILOTES - 2 PAR ÉCURIE)`;

                let pilots = [...appData[`league${leagueKey}`]];
                // Calcul total par pilote et tri
                pilots.forEach(p => {
                    p.total = p.scores.reduce((a, b) => a + b, 0);
                });
                pilots.sort((a, b) => b.total - a.total);

                let html = `
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-blue-950/80 text-gold border-b border-gold/30 text-xs">
                                <th class="p-2 w-12 text-center">POS.</th>
                                <th class="p-2">PILOTE & ÉCURIE</th>
                                <th class="p-2 text-center w-16">TOTAL</th>
                                ${circuits.map(c => `<th class="p-2 text-center">${c.substring(0,3).toUpperCase()}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
                `;

                pilots.forEach((pilot, index) => {
                    let team = teamsConfig.find(t => t.id === pilot.teamId);
                    let teamColor = team ? team.color : '#ffffff';

                    html += `
                        <tr class="border-b border-slate-800 hover:bg-slate-900/60 transition-colors">
                            <td class="p-2 text-center font-bold text-slate-300">${index + 1}</td>
                            <td class="p-2 font-bold flex items-center gap-2">
                                <span class="w-3 h-3 rounded-full inline-block shrink-0" style="background-color: ${teamColor};"></span>
                                ${isEditMode ? 
                                    `<input type="text" value="${pilot.name}" onchange="updateName('${leagueKey}', '${pilot.id}', this.value)" class="bg-slate-900 border border-slate-700 text-white px-2 py-1 rounded text-xs w-full">` : 
                                    `<span class="text-white">${pilot.name}</span>`
                                }
                            </td>
                            <td class="p-2 text-center font-black text-gold bg-black/20">${pilot.total}</td>
                            ${pilot.scores.map((score, cIdx) => `
                                <td class="p-2 text-center">
                                    ${isEditMode ? 
                                        `<input type="number" value="${score}" onchange="updateScore('${leagueKey}', '${pilot.id}', ${cIdx}, this.value)" class="w-14 bg-slate-900 border border-slate-700 text-center text-gold font-bold rounded py-1 text-xs">` :
                                        `<span class="text-slate-200 font-medium">${score}</span>`
                                    }
                                </td>
                            `).join('')}
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                container.innerHTML = html;
            }
        }

        // Premier affichage au chargement
        render();
    </script>
</body>
</html>
