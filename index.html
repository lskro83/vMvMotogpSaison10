<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vMv | MotoGP - SAISON 10</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #061121;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .bg-vmsdark { background-color: #0a1930; }
        .bg-vmsdarker { background-color: #061121; }
        .border-gold { border-color: #d4af37; }
        .text-gold { color: #d4af37; }
        .gold-gradient {
            background: linear-gradient(90deg, #b8860b 0%, #ffd700 50%, #b8860b 100%);
        }
        /* Style compact pour tout voir sur l'écran */
        table.compact-table th, table.compact-table td {
            padding: 4px 6px !important;
            font-size: 11px !important;
        }
    </style>
</head>
<body class="min-h-screen p-1 md:p-4 bg-vmsdarker">

    <!-- En-tête officiel vMv -->
    <div class="max-w-7xl mx-auto border-2 border-gold rounded-xl p-3 bg-vmsdark shadow-2xl mb-4">
        <div class="flex flex-col md:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-2">
                <div class="bg-gold text-black font-extrabold px-2 py-0.5 rounded text-base tracking-wider shadow">vMv</div>
                <span class="text-base md:text-lg font-bold tracking-widest text-gold uppercase">MotoGP - SAISON 10</span>
            </div>
            
            <!-- Boutons de navigation des tableaux -->
            <div class="flex flex-wrap gap-1.5 justify-center">
                <button onclick="switchTab('constructors')" id="btn-constructors" class="px-3 py-1.5 font-bold rounded-lg text-xs transition-all bg-amber-500 text-black shadow-lg">🏆 Écuries Interligue</button>
                <button onclick="switchTab('leagueA')" id="btn-leagueA" class="px-3 py-1.5 font-bold rounded-lg text-xs transition-all bg-blue-900/60 text-white hover:bg-blue-800">🏁 Ligue A (20)</button>
                <button onclick="switchTab('leagueB')" id="btn-leagueB" class="px-3 py-1.5 font-bold rounded-lg text-xs transition-all bg-blue-900/60 text-white hover:bg-blue-800">🏁 Ligue B (20)</button>
            </div>

            <div class="flex gap-2">
                <button onclick="toggleEditMode()" id="btn-edit" class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-xs shadow">✏️ Éditer</button>
                <button onclick="resetData()" class="px-2.5 py-1.5 bg-red-800 hover:bg-red-700 text-white font-bold rounded-lg text-xs shadow" title="Réinitialiser">🔄</button>
            </div>
        </div>
    </div>

    <!-- Conteneur Principal des Tableaux -->
    <div class="max-w-7xl mx-auto border-2 border-gold rounded-xl bg-vmsdark overflow-hidden shadow-2xl">
        
        <!-- Titre du tableau actif -->
        <div id="table-title-banner" class="gold-gradient text-black text-center font-black py-1.5 text-sm md:text-base tracking-wider uppercase shadow-inner">
            Classement Ecuries Interligue
        </div>

        <div class="overflow-x-auto">
            <div id="app-content" class="p-1 min-w-[850px]">
                <!-- Inséré dynamiquement par JavaScript -->
            </div>
        </div>
    </div>

    <!-- Pied de page -->
    <div class="max-w-7xl mx-auto mt-3 flex justify-between items-center text-[10px] text-slate-400 px-1">
        <span>📱 Version condensée pour affichage complet sur écran</span>
        <span class="text-gold font-semibold">[vMv] VilVinde Multigaming</span>
    </div>

    <script>
        // 10 Circuits avec drapeaux officiels
        const circuits = [
            { name: "Misano", flag: "🇮🇹" },
            { name: "Phillip Island", flag: "🇦🇺" },
            { name: "Sepang", flag: "🇲🇾" },
            { name: "Aragon", flag: "🇪🇸" },
            { name: "Austin", flag: "🇺🇸" },
            { name: "Catalunya", flag: "🇪🇸" },
            { name: "Portimao", flag: "🇵🇹" },
            { name: "Mugello", flag: "🇮🇹" },
            { name: "Motegi", flag: "🇯🇵" },
            { name: "Jerez", flag: "🇪🇸" }
        ];
        
        // 10 Écuries officielles MotoGP avec logos/badges textuels officiels
        const teamsConfig = [
            { id: "trackhouse", name: "Aprilia TrackHouse", shortName: "TrackHouse", color: "#00b4d8", badge: "TRK" },
            { id: "vr46", name: "Ducati VR46", shortName: "VR46 Racing", color: "#ffd166", badge: "VR46" },
            { id: "pramac", name: "Yamaha Pramac", shortName: "Pramac Yamaha", color: "#7209b7", badge: "PMA" },
            { id: "ktm", name: "Red Bull KTM", shortName: "Red Bull KTM", color: "#f77f00", badge: "KTM" },
            { id: "lcr", name: "Honda LCR", shortName: "Honda LCR", color: "#52b788", badge: "LCR" },
            { id: "tech3", name: "KTM Tech 3", shortName: "Tech3 KTM", color: "#ffb703", badge: "TC3" },
            { id: "aprilia", name: "Aprilia Factory", shortName: "Aprilia Racing", color: "#b5179e", badge: "APR" },
            { id: "ducati", name: "Ducati Lenovo", shortName: "Ducati Lenovo", color: "#d90429", badge: "DUQ" },
            { id: "yamaha", name: "Yamaha Factory", shortName: "Yamaha Factory", color: "#4361ee", badge: "YAM" },
            { id: "hrc", name: "Honda HRC", shortName: "Honda HRC", color: "#3a86ff", badge: "HRC" }
        ];

        let currentTab = 'constructors';
        let isEditMode = false;

        function generateDefaultPilots(leagueName) {
            let pilots = [];
            teamsConfig.forEach(team => {
                for (let i = 1; i <= 2; i++) {
                    pilots.push({
                        id: `${leagueName}_${team.id}_${i}`,
                        name: `${team.shortName} (${leagueName === 'A' ? 'P1' : 'P2'})`,
                        teamId: team.id,
                        scores: new Array(10).fill(0)
                    });
                }
            });
            return pilots;
        }

        let appData = JSON.parse(localStorage.getItem('vmv_motoGP_saison10_v2')) || {
            leagueA: generateDefaultPilots('A'),
            leagueB: generateDefaultPilots('B')
        };

        function saveData() {
            localStorage.setItem('vmv_motoGP_saison10_v2', JSON.stringify(appData));
        }

        function switchTab(tab) {
            currentTab = tab;
            ['constructors', 'leagueA', 'leagueB'].forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                if (t === tab) {
                    btn.className = "px-3 py-1.5 font-bold rounded-lg text-xs transition-all bg-amber-500 text-black shadow-lg";
                } else {
                    btn.className = "px-3 py-1.5 font-bold rounded-lg text-xs transition-all bg-blue-900/60 text-white hover:bg-blue-800";
                }
            });
            render();
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            const btn = document.getElementById('btn-edit');
            if (isEditMode) {
                btn.className = "px-2.5 py-1.5 bg-amber-600 hover:bg-amber-500 text-black font-bold rounded-lg text-xs shadow";
                btn.innerHTML = "💾 Verrouiller";
            } else {
                btn.className = "px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-xs shadow";
                btn.innerHTML = "✏️ Éditer";
            }
            render();
        }

        function resetData() {
            if (confirm("Réinitialiser les scores de la Saison 10 ?")) {
                appData = {
                    leagueA: generateDefaultPilots('A'),
                    leagueB: generateDefaultPilots('B')
                };
                saveData();
                render();
            }
        }

        function updateScore(league, pilotId, circuitIdx, val) {
            const num = parseInt(val) || 0;
            const pilot = appData[`league${league}`].find(p => p.id === pilotId);
            if (pilot) {
                pilot.scores[circuitIdx] = num;
                saveData();
                render();
            }
        }

        function updateName(league, pilotId, newName) {
            const pilot = appData[`league${league}`].find(p => p.id === pilotId);
            if (pilot) {
                pilot.name = newName;
                saveData();
            }
        }

        function render() {
            const container = document.getElementById('app-content');
            const titleBanner = document.getElementById('table-title-banner');

            if (currentTab === 'constructors') {
                titleBanner.innerText = "🏆 CLASSEMENT ECURIES INTERLIGUE (LIGUE A + B)";
                
                let constructorsSummary = teamsConfig.map(team => {
                    let teamPilotsA = appData.leagueA.filter(p => p.teamId === team.id);
                    let teamPilotsB = appData.leagueB.filter(p => p.teamId === team.id);
                    let allTeamPilots = [...teamPilotsA, ...teamPilotsB];

                    let totalScores = new Array(10).fill(0);
                    allTeamPilots.forEach(p => {
                        p.scores.forEach((s, idx) => {
                            totalScores[idx] += s;
                        });
                    });
                    let grandTotal = totalScores.reduce((a, b) => a + b, 0);

                    return {
                        ...team,
                        total: grandTotal,
                        circuitScores: totalScores
                    };
                });

                constructorsSummary.sort((a, b) => b.total - a.total);

                let html = `
                    <table class="w-full text-left border-collapse compact-table">
                        <thead>
                            <tr class="bg-blue-950/90 text-gold border-b border-gold/30">
                                <th class="w-8 text-center">POS</th>
                                <th>ÉCURIE</th>
                                <th class="text-center w-12">TOT</th>
                                ${circuits.map(c => `<th class="text-center" title="${c.name}">${c.flag}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
                `;

                constructorsSummary.forEach((item, index) => {
                    html += `
                        <tr class="border-b border-slate-800/80 hover:bg-slate-900/60 transition-colors">
                            <td class="text-center font-bold text-slate-300">${index + 1}</td>
                            <td class="font-bold flex items-center gap-1.5 py-1">
                                <span class="px-1 py-0.5 rounded text-[9px] font-black text-black" style="background-color: ${item.color};">${item.badge}</span>
                                <span class="text-white truncate max-w-[120px] md:max-w-none">${item.name}</span>
                            </td>
                            <td class="text-center font-black text-gold bg-black/30">${item.total}</td>
                            ${item.circuitScores.map(score => `<td class="text-center font-semibold text-slate-200">${score}</td>`).join('')}
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                container.innerHTML = html;

            } else {
                let leagueKey = currentTab === 'leagueA' ? 'A' : 'B';
                titleBanner.innerText = `🏁 CLASSEMENT LIGUE ${leagueKey} (20 PILOTES)`;

                let pilots = [...appData[`league${leagueKey}`]];
                pilots.forEach(p => {
                    p.total = p.scores.reduce((a, b) => a + b, 0);
                });
                pilots.sort((a, b) => b.total - a.total);

                let html = `
                    <table class="w-full text-left border-collapse compact-table">
                        <thead>
                            <tr class="bg-blue-950/90 text-gold border-b border-gold/30">
                                <th class="w-8 text-center">POS</th>
                                <th>PILOTE / ÉCURIE</th>
                                <th class="text-center w-12">TOT</th>
                                ${circuits.map(c => `<th class="text-center" title="${c.name}">${c.flag}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
                `;

                pilots.forEach((pilot, index) => {
                    let team = teamsConfig.find(t => t.id === pilot.teamId);
                    let teamColor = team ? team.color : '#ffffff';
                    let teamBadge = team ? team.badge : 'MOT';

                    html += `
                        <tr class="border-b border-slate-800/80 hover:bg-slate-900/60 transition-colors">
                            <td class="text-center font-bold text-slate-300">${index + 1}</td>
                            <td class="font-bold flex items-center gap-1.5 py-1">
                                <span class="px-1 py-0.5 rounded text-[9px] font-black text-black shrink-0" style="background-color: ${teamColor};">${teamBadge}</span>
                                ${isEditMode ? 
                                    `<input type="text" value="${pilot.name}" onchange="updateName('${leagueKey}', '${pilot.id}', this.value)" class="bg-slate-900 border border-slate-700 text-white px-1 py-0.5 rounded text-[11px] w-full">` : 
                                    `<span class="text-white truncate max-w-[120px] md:max-w-none">${pilot.name}</span>`
                                }
                            </td>
                            <td class="text-center font-black text-gold bg-black/30">${pilot.total}</td>
                            ${pilot.scores.map((score, cIdx) => `
                                <td class="text-center">
                                    ${isEditMode ? 
                                        `<input type="number" value="${score}" onchange="updateScore('${leagueKey}', '${pilot.id}', ${cIdx}, this.value)" class="w-10 bg-slate-900 border border-slate-700 text-center text-gold font-bold rounded py-0.5 text-[11px]">` :
                                        `<span class="text-slate-200 font-semibold">${score}</span>`
                                    }
                                </td>
                            `).join('')}
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                container.innerHTML = html;
            }
        }

        render();
    </script>
</body>
</html>
